baseURL = "https://elblogdeana.com/"
locale = "es-ES"
title = "El Blog de Ana | Orientación Educativa y Profesional"
theme = "anatrinxet"
defaultContentLanguage = "es"
enableRobotsTXT = true
paginate = 9
disableKinds = ["taxonomy", "term"]

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "category"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

